<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="scrollProgress"></div>

    <button id="backToTop" title="Go to top">↑</button>

    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <label for="drawing">Drawing:</label>
        <input type="checkbox" id="drawing" name="drawing" value="Yes"><br><br>

        <label for="dancing">Dancing:</label>
        <input type="checkbox" id="dancing" name="dancing" value="Yes"><br><br>

        <label for="singing">Singing:</label>
        <input type="checkbox" id="singing" name="singing" value="Yes"><br><br>

        <label for="coding">Coding:</label>
        <input type="checkbox" id="coding" name="coding" value="Yes"><br><br>

        <label for="sports">Sports:</label>
        <input type="checkbox" id="sports" name="sports" value="Yes"><br><br>

        <label for="photographer">Photography:</label>
        <input type="checkbox" id="photographer" name="photographer" value="Yes"><br><br>

        <button type="submit">Submit</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Scroll progress bar
        window.addEventListener('scroll', () => {
            const scrolled = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
            document.getElementById('scrollProgress').style.width = scrolled + '%';

            // Back to top toggle
            const topBtn = document.getElementById("backToTop");
            topBtn.style.display = (window.scrollY > 300) ? "block" : "none";
        });

        // Back to top action
        document.getElementById("backToTop").onclick = () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
