<!-- Scroll Progress Bar -->
<div id="scrollProgress"></div>

<!-- Back to Top Button -->
<button id="backToTop" title="Go to top">↑</button>

<style>
  #scrollProgress {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: #00796b;
    width: 0%;
    z-index: 9999;
    transition: width 0.25s ease-out;
  }

  #backToTop {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background-color: #00796b;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 50%;
    font-size: 18px;
    display: none;
    z-index: 9999;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  #backToTop:hover {
    transform: scale(1.1);
  }

  .container .floating-label,
  .checkbox-label,
  button[type="submit"] {
    animation: bounceIn 0.8s ease forwards;
    opacity: 0;
  }

  .floating-label:nth-child(1) { animation-delay: 0.3s; }
  .floating-label:nth-child(2) { animation-delay: 0.5s; }
  .checkbox-label:nth-child(n+3) { animation-delay: calc(0.5s + (var(--i, 1) * 0.1s)); }
  button[type="submit"] { animation-delay: 1.5s; }

  @keyframes bounceIn {
    0% { opacity: 0; transform: translateY(40px); }
    60% { opacity: 1; transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  .char-count {
    font-size: 13px;
    text-align: right;
    margin-top: 4px;
    color: #00796b;
  }

  body.dark .char-count {
    color: #80cbc4;
  }
</style>

<script>
  // Scroll progress bar
  window.addEventListener('scroll', () => {
    const scrolled = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
    document.getElementById('scrollProgress').style.width = scrolled + '%';

    // Back to top toggle
    const topBtn = document.getElementById("backToTop");
    topBtn.style.display = (window.scrollY > 300) ? "block" : "none";
  });

  // Back to top action
  document.getElementById("backToTop").onclick = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Parallax particles
  document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    document.querySelector('.bg-particles').style.transform = `translate(${x}px, ${y}px)`;
  });

  // Character counter
  const nameInput = document.getElementById('name');
  const charCount = document.createElement('div');
  charCount.className = 'char-count';
  nameInput.parentElement.appendChild(charCount);
  nameInput.addEventListener('input', () => {
    charCount.textContent = `${nameInput.value.length} characters`;
  });

  // Add celebration sound
  document.addEventListener('DOMContentLoaded', () => {
    const success = document.querySelector('.message.success');
    if (success) {
      const sound = new Audio('{{ url_for("static", filename="celebration.mp3") }}');
      sound.play();
    }
  });

  // Bounce delay for checkboxes
  document.querySelectorAll('.checkbox-label').forEach((el, i) => {
    el.style.setProperty('--i', i);
  });
</script>
