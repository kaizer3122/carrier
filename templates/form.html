<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animated Career Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* Basic styles for your form */
    body {
      font-family: 'Arial', sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
    }
    .floating-label {
      position: relative;
      margin-bottom: 25px;
    }
    .floating-label input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .floating-label label {
      position: absolute;
      top: 12px;
      left: 15px;
      font-size: 16px;
      color: #aaa;
      transition: 0.3s;
    }
    .floating-label input:focus + label,
    .floating-label input:not(:placeholder-shown) + label {
      top: -8px;
      font-size: 12px;
      color: #00796b;
    }
    .checkbox-label {
      display: block;
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      background-color: #00796b;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #004d40;
    }
    .message {
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Career Interest Form</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="floating-label">
      <input type="text" id="name" name="name" placeholder=" " required>
      <label for="name">Your Name</label>
    </div>

    <div class="floating-label">
      <input type="text" id="age" name="age" placeholder=" " required>
      <label for="age">Your Age</label>
    </div>

    <label>Select your interests:</label><br>
    <label class="checkbox-label"><input type="checkbox" name="drawing" value="Yes">Drawing</label>
    <label class="checkbox-label"><input type="checkbox" name="dancing" value="Yes">Dancing</label>
    <label class="checkbox-label"><input type="checkbox" name="singing" value="Yes">Singing</label>
    <label class="checkbox-label"><input type="checkbox" name="coding" value="Yes">Coding</label>
    <label class="checkbox-label"><input type="checkbox" name="sports" value="Yes">Sports</label>
    <label class="checkbox-label"><input type="checkbox" name="photographer" value="Yes">Photographer</label><br>

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
